name: test-tutorial-workflow

on:
  push:
    branches:
      - master
      - '8.*.x'
  pull_request:
    paths-ignore:
      - '.github/workflows/*.ya?ml'
      - '!.github/workflows/test_tutorial_workflow.yml'
      - 'tests/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -c "exec $CONDA_PREFIX/bin/bash -elo pipefail {0}"

env:
  FORCE_COLOR: 2
  PIP_PROGRESS_BAR: off

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            python-version: '3'
          - os: 'ubuntu-22.04'
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Install System Dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          cache-environment: true
          post-cleanup: 'all'
          environment-name: cylc-tutorial-test
          create-args: >-
            python=${{ matrix.python-version }}
            pip
            bash
            h5py
          # h5py included here due to https://github.com/cylc/cylc-flow/issues/7549

      - name: install cylc-flow
        run: pip install .[tutorials]

      # Useful debug info:
      - run: |
          python --version
          pip list

      - name: run tutorial workflow
        run: |
          mkdir -p "${HOME}/cylc-run"
          etc/bin/run-validate-tutorials

      - name: debug
        if: failure()
        run: |
          find ~/cylc-run -name job.err -exec cat {} +  # cylc error files
