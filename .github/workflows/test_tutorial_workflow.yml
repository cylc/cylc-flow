name: test-tutorial-workflow

on:
  push:
    branches:
      - master
      - '8.*.x'
  pull_request:
    paths-ignore:
      - '.github/workflows/*.ya?ml'
      - '!.github/workflows/test_tutorial_workflow.yml'
      - 'tests/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: 2
  PIP_PROGRESS_BAR: off

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            # Temporary pinned while h5py doesn't have python 3.15 wheels.
            # See https://github.com/cylc/cylc-flow/issues/7549
            python-version: '3.14'
          - os: 'ubuntu-22.04'
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: configure python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: checkout
        uses: actions/checkout@v7

      - name: Install docs/tutorial dependencies
        uses: cylc/cylc-doc/.github/actions/install-dependencies@master

      - name: install cylc-flow
        run: pip install . --group tutorials

      # Useful debug info:
      - run: pip list

      - name: run tutorial workflow
        run: |
          mkdir -p "${HOME}/cylc-run"
          etc/bin/run-validate-tutorials

      - name: debug
        if: failure()
        run: |
          find ~/cylc-run -name job.err -exec cat {} +  # cylc error files
